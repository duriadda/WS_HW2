<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="12">
  <!-- 승인 취소 시퀀스 다이어그램: 화면 → API·인증 → 서비스 → DB, 트랜잭션 범위와 COMMIT/ROLLBACK 분기 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#555"/></marker>
  </defs>
  <rect width="1000" height="1060" fill="#fff"/>
  <text x="20" y="30" font-size="20" font-weight="700">승인 취소(revoke) 시퀀스 다이어그램</text>

  <!-- 참여자 -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="50" width="160" height="50" rx="6" fill="#eef4ff" stroke="#0969da"/>
    <text x="100" y="72">운영자 화면</text><text x="100" y="90" font-weight="400" font-size="11">public/app.js</text>
    <rect x="220" y="50" width="180" height="50" rx="6" fill="#eef4ff" stroke="#0969da"/>
    <text x="310" y="72">API·인증</text><text x="310" y="90" font-weight="400" font-size="11">src/app.js · auth.js</text>
    <rect x="450" y="50" width="200" height="50" rx="6" fill="#fff6d6" stroke="#b08800"/>
    <text x="550" y="72">서비스</text><text x="550" y="90" font-weight="400" font-size="11">application-service.js revoke()</text>
    <rect x="720" y="50" width="200" height="50" rx="6" fill="#eef4ff" stroke="#0969da"/>
    <text x="820" y="72">저장소·DB</text><text x="820" y="90" font-weight="400" font-size="11">repository.js · SQLite</text>
  </g>
  <g stroke="#999" stroke-dasharray="4 4">
    <line x1="100" y1="100" x2="100" y2="1005"/><line x1="310" y1="100" x2="310" y2="1005"/>
    <line x1="550" y1="100" x2="550" y2="1005"/><line x1="820" y1="100" x2="820" y2="1005"/>
  </g>

  <!-- 1~4: 화면 → API -->
  <line x1="100" y1="135" x2="308" y2="135" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="108" y="128">① POST /api/applications/:id/revoke {reason}</text>
  <rect x="316" y="150" width="226" height="58" fill="#f6f8fa" stroke="#ccc"/>
  <text x="322" y="166">② JWT 검증 → 실패 시 401</text>
  <text x="322" y="182">③ positiveId, 본문 키 1개, reason</text>
  <text x="322" y="198">   trim 후 5~200자 → 실패 시 400</text>
  <line x1="310" y1="230" x2="548" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="318" y="223">④ service.revoke(actor, id, reason)</text>

  <!-- 트랜잭션 범위 -->
  <rect x="440" y="248" width="540" height="700" fill="#fffbea" fill-opacity="0.5" stroke="#b08800" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="450" y="266" font-size="13" font-weight="700" fill="#8a6d00">트랜잭션 범위: transaction(work) — BEGIN IMMEDIATE ~ COMMIT/ROLLBACK</text>

  <line x1="550" y1="290" x2="818" y2="290" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="558" y="284">⑤ BEGIN IMMEDIATE (쓰기 잠금 획득)</text>

  <line x1="550" y1="325" x2="818" y2="325" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="558" y="319">⑥ repo.application(id), repo.event(eventId)</text>
  <line x1="818" y1="345" x2="552" y2="345" stroke="#555" stroke-dasharray="4 3" marker-end="url(#o)"/>
  <text x="600" y="360" fill="#555">최신 신청·행사 (없으면 404)</text>

  <rect x="556" y="372" width="170" height="44" fill="#f6f8fa" stroke="#ccc"/>
  <text x="562" y="389">⑦ isManagerOf → 아니면 403</text>
  <text x="562" y="406">   status≠APPROVED → 409</text>

  <line x1="550" y1="440" x2="818" y2="440" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="558" y="434">⑧ setStatus(id,'REVOKED') — UPDATE applications</text>
  <line x1="550" y1="475" x2="818" y2="475" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="558" y="469">⑨ addHistory(REVOKE, reason) — INSERT history</text>
  <line x1="818" y1="492" x2="552" y2="492" stroke="#555" stroke-dasharray="4 3" marker-end="url(#o)"/>
  <text x="600" y="507" fill="#555">revokeHistoryId</text>

  <line x1="550" y1="535" x2="818" y2="535" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="558" y="529">⑩ nextPending(eventId) — SELECT … status='PENDING'</text>
  <text x="600" y="550" fill="#555">ORDER BY created_at ASC, id ASC LIMIT 1</text>

  <!-- alt: 대기자 있음 -->
  <rect x="452" y="565" width="516" height="110" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="452" y="565" width="150" height="20" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="458" y="580" font-weight="700" fill="#1a7f37">opt [대기자 있음]</text>
  <line x1="550" y1="610" x2="818" y2="610" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="558" y="604">⑪ setStatus(next.id,'APPROVED') — UPDATE</text>
  <line x1="550" y1="648" x2="818" y2="648" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="558" y="642">⑫ addHistory(AUTO_APPROVE, causeHistoryId=revokeHistoryId)</text>
  <text x="600" y="666" fill="#555">없으면 promoted = null (빈자리 유지)</text>

  <!-- alt: COMMIT / ROLLBACK -->
  <rect x="452" y="695" width="516" height="240" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="452" y="695" width="190" height="20" fill="#eee" stroke="#333"/>
  <text x="458" y="710" font-weight="700">alt [work() 정상 종료]</text>
  <line x1="550" y1="740" x2="818" y2="740" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
  <text x="558" y="734" fill="#1a7f37" font-weight="700">⑬ COMMIT → 신청 2건 + 이력 2건 함께 확정</text>
  <line x1="452" y1="790" x2="968" y2="790" stroke="#333" stroke-dasharray="6 4"/>
  <text x="458" y="808" font-weight="700">[⑥~⑫ 중 예외: 거부(AppError) 또는 저장 오류]</text>
  <text x="458" y="826" fill="#555">예: ⑫의 INSERT가 실패(T29 트리거)</text>
  <line x1="550" y1="850" x2="818" y2="850" stroke="#cf222e" stroke-width="2" marker-end="url(#a)"/>
  <text x="558" y="844" fill="#cf222e" font-weight="700">⑬' ROLLBACK (db.isTransaction일 때)</text>
  <text x="558" y="870" fill="#cf222e">⑧·⑨·⑪ 변경 전부 취소 → 요청 전 상태</text>
  <text x="558" y="890" fill="#555">예외를 다시 던짐(throw e)</text>
  <text x="558" y="910" fill="#555">AppError → 404/403/409, 그 외 → 500 INTERNAL_ERROR</text>

  <!-- 응답 -->
  <line x1="548" y1="970" x2="312" y2="970" stroke="#555" stroke-dasharray="4 3" marker-end="url(#o)"/>
  <text x="330" y="964" fill="#555">{revoked, promoted} 또는 예외</text>
  <line x1="308" y1="995" x2="102" y2="995" stroke="#555" stroke-dasharray="4 3" marker-end="url(#o)"/>
  <text x="116" y="989" fill="#555">200 JSON / {code,message}</text>
  <text x="20" y="1040">⑭ 화면은 결과와 관계없이 refresh()로 행사·신청 목록을 다시 조회해 저장된 상태를 표시합니다.</text>
</svg>
